spring:
  application:
    name: api
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: test-only-secret-key-for-junit-do-not-use-elsewhere-minimum-32-bytes
    expiration-minutes: 1440
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:3000
