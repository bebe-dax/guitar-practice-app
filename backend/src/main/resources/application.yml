# backend/src/main/resources/application.yml（新規作成）
# DB接続情報は docker-compose.yml の POSTGRES_DB/USER/PASSWORD と一致させる
spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:guitar_practice}
    username: ${DB_USER:guitar_practice}
    password: ${DB_PASSWORD:guitar_practice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

app:
  jwt:
    # 本番では必ず JWT_SECRET 環境変数で上書きすること（既定値は開発専用・秘匿情報ではない）
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-production-via-JWT_SECRET}
    expiration-minutes: 1440
    # 本番（HTTPS）では JWT_COOKIE_SECURE=true を設定する。ローカルは http のため既定 false
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
